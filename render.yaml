services:
  - type: web
    name: voice-rag-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_API_URL
        value: https://api.sarvam.ai/speech-to-text
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: FRONTEND_ORIGINS
        value: https://voice-rag-frontend-omega.vercel.app,http://localhost:3000,http://localhost:3005,http://127.0.0.1:3000

